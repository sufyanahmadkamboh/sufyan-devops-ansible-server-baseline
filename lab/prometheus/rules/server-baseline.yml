---
groups:
  - name: server-baseline
    rules:
      - alert: ServerDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} stopped answering metrics requests"
          description: "The server is down, node_exporter stopped, or the firewall blocks Prometheus."

      # A protection that is not running protects nothing.
      - alert: SecurityServiceNotRunning
        expr: |
          node_systemd_unit_state{state="active",
            name=~"ssh.service|fail2ban.service|server-baseline-firewall.service|apt-daily-upgrade.timer|server-baseline-audit.timer"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} is not running on {{ $labels.instance }}"
          description: "Re-apply the baseline (make harden) or check: systemctl status {{ $labels.name }}"

      # auditd cannot run inside containers (the kernel audit system belongs to the host).
      - alert: AuditdNotRunning
        expr: |
          node_systemd_unit_state{name="auditd.service",state="active"} == 0
          and on(instance) server_baseline_info{kind="machine"}
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "auditd is not running on {{ $labels.instance }}"
          description: "Changes to accounts, sudo and SSH settings are not being recorded."

      - alert: LynisScoreLow
        expr: lynis_hardening_index < 75
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} Lynis hardening index is {{ $value }} (target 75+)"
          description: "Something weakened the server or the baseline was never applied. Run: make audit"

      - alert: LynisReportStale
        expr: time() - lynis_last_run_timestamp_seconds > 8 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No Lynis audit on {{ $labels.instance }} for more than 8 days"
          description: "The weekly server-baseline-audit.timer did not run. Check: systemctl list-timers"

      - alert: SSHAttackerBanned
        expr: fail2ban_banned_current > 0
        labels:
          severity: info
        annotations:
          summary: "fail2ban is blocking {{ $value }} address(es) on {{ $labels.instance }}"
          description: "Someone kept failing SSH logins and was banned. Usually noise from scanners; check if it is a colleague."

      - alert: Fail2banNotAnswering
        expr: fail2ban_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "fail2ban's SSH jail on {{ $labels.instance }} does not answer"
          description: "Brute-force protection may be off. Check: sudo fail2ban-client status sshd"

      - alert: MetricsFileBroken
        expr: node_textfile_scrape_error == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A baseline metrics file on {{ $labels.instance }} cannot be read"
          description: "Check the files in /var/lib/node_exporter/textfile/"

      - alert: DiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} has less than 10% free"
          description: "Full disks stop logging (including audit logs) and updates."
