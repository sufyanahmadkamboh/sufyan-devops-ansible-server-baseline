---
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # The servers' firewalls only accept port 9100 from this Prometheus (172.30.0.10).
  - job_name: node
    static_configs:
      - targets: ["web-01:9100", "db-01:9100"]
    relabel_configs:
      # "web-01:9100" -> "web-01"
      - source_labels: [__address__]
        regex: "([^:]+):\\d+"
        target_label: instance
        replacement: "$1"

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
