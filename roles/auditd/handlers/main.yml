---
# auditd refuses `systemctl restart` (RefuseManualStop), so its own init script is used.
- name: Restart auditd
  ansible.builtin.command: /usr/sbin/service auditd restart  # noqa: command-instead-of-module
  changed_when: true
  when: auditd_manage_service | bool

- name: Load audit rules
  ansible.builtin.command: /usr/sbin/augenrules --load
  changed_when: true
  when: auditd_manage_service | bool
