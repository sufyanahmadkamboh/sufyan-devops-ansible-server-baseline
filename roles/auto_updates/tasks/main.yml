---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Turn on the daily update check and install
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Set update behaviour (reboot, cleanup, logging)
  ansible.builtin.template:
    src: 52server-baseline.j2
    dest: /etc/apt/apt.conf.d/52server-baseline
    owner: root
    group: root
    mode: "0644"

- name: Enable the apt timers that trigger the updates
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
