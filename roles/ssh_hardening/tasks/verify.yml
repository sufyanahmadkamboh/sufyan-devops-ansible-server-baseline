---
# `sshd -T` prints the settings sshd really uses after reading every file.
- name: Read the effective SSH server settings
  ansible.builtin.command: sshd -T -C user=nobody,host=localhost,addr=127.0.0.1
  register: ssh_hardening_effective
  changed_when: false

- name: Turn them into a dictionary
  ansible.builtin.set_fact:
    ssh_hardening_settings: >-
      {{ dict(ssh_hardening_effective.stdout_lines
              | map('regex_search', '^(\S+)\s+(.*)$', '\1', '\2') | select | list) }}

- name: Check the security-relevant settings
  ansible.builtin.assert:
    that:
      - ssh_hardening_settings.permitrootlogin == 'no'
      - ssh_hardening_settings.passwordauthentication == 'no'
      - ssh_hardening_settings.kbdinteractiveauthentication == 'no'
      - ssh_hardening_settings.pubkeyauthentication == 'yes'
      - ssh_hardening_settings.authenticationmethods == 'publickey'
      - ssh_hardening_settings.permitemptypasswords == 'no'
      - ssh_hardening_settings.maxauthtries == ssh_hardening_max_auth_tries | string
      - ssh_hardening_settings.x11forwarding == 'no'
      - ssh_hardening_settings.allowtcpforwarding == 'no'
      - ssh_hardening_settings.allowagentforwarding == 'no'
      - ssh_hardening_settings.allowgroups == ssh_hardening_allow_groups | join(' ')
      - ssh_hardening_settings.loglevel == 'VERBOSE'
      - "'cbc' not in ssh_hardening_settings.ciphers"
      - "'sha1' not in ssh_hardening_settings.macs"
    quiet: true

- name: Check no weak Diffie-Hellman groups are left
  ansible.builtin.command: awk '$5 < {{ ssh_hardening_moduli_min_bits }} && $1 !~ /^#/' /etc/ssh/moduli
  register: ssh_hardening_weak_left
  changed_when: false
  failed_when: ssh_hardening_weak_left.stdout | length > 0

- name: Check sshd is running and starts at boot
  ansible.builtin.systemd_service:
    name: ssh.service
  register: ssh_hardening_unit
  failed_when: >-
    ssh_hardening_unit.status.ActiveState != 'active'
    or ssh_hardening_unit.status.UnitFileState != 'enabled'
