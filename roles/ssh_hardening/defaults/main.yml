---
ssh_hardening_port: 22

# Only members of these groups can log in (the common role puts admins in ssh-users).
ssh_hardening_allow_groups:
  - ssh-users

ssh_hardening_max_auth_tries: 3
ssh_hardening_max_sessions: 2
ssh_hardening_login_grace_time: 30
# Drop dead sessions after 300 s x 2 = 10 minutes of silence.
ssh_hardening_client_alive_interval: 300
ssh_hardening_client_alive_count_max: 2

# Modern algorithms only. All are available in OpenSSH 9.2+ (Debian 12, Ubuntu 24.04, Debian 13).
ssh_hardening_kex_algorithms:
  - sntrup761x25519-sha512@openssh.com
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group18-sha512
  - diffie-hellman-group16-sha512
ssh_hardening_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr
ssh_hardening_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - umac-128-etm@openssh.com

# Diffie-Hellman groups smaller than this are removed from /etc/ssh/moduli.
ssh_hardening_moduli_min_bits: 3071

# Ubuntu 24.04 starts sshd on demand through ssh.socket. The baseline switches to the
# classic always-running ssh.service so the port and settings live in one place.
ssh_hardening_disable_socket_activation: true
