---
- name: Work out the download name for this CPU
  ansible.builtin.set_fact:
    node_exporter_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"

- name: Name the release for this version and CPU
  ansible.builtin.set_fact:
    node_exporter_release: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"

- name: Create the node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the install and textfile directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ node_exporter_install_dir }}"
    - "{{ node_exporter_textfile_dir }}"

# Each version gets its own folder; /usr/local/bin/node_exporter points at the active one.
# get_url checks the SHA-256 before anything is unpacked, and skips the download when the
# archive is already there with the right checksum.
- name: Download node_exporter (checksum verified)
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_release }}.tar.gz"
    dest: "{{ node_exporter_install_dir }}/{{ node_exporter_release }}.tar.gz"
    checksum: "sha256:{{ node_exporter_checksums[node_exporter_arch] }}"
    owner: root
    group: root
    mode: "0644"
  register: node_exporter_archive
  until: node_exporter_archive is succeeded
  retries: 3
  delay: 5

- name: Unpack node_exporter
  ansible.builtin.unarchive:
    src: "{{ node_exporter_install_dir }}/{{ node_exporter_release }}.tar.gz"
    dest: "{{ node_exporter_install_dir }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ node_exporter_install_dir }}/{{ node_exporter_release }}/node_exporter"
  when: not (ansible_check_mode and node_exporter_archive is changed)

- name: Point /usr/local/bin/node_exporter at this version
  ansible.builtin.file:
    src: "{{ node_exporter_install_dir }}/{{ node_exporter_release }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    state: link
  when: not (ansible_check_mode and node_exporter_archive is changed)
  notify: Restart node_exporter

- name: Describe this server's baseline for dashboards
  ansible.builtin.template:
    src: baseline.prom.j2
    dest: "{{ node_exporter_textfile_dir }}/baseline.prom"
    owner: root
    group: root
    mode: "0644"

- name: Install the node_exporter service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Start node_exporter now and at every boot
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
