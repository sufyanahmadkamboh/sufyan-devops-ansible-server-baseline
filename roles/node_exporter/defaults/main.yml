---
node_exporter_version: 1.12.1
# From https://github.com/prometheus/node_exporter/releases/download/v1.12.1/sha256sums.txt
node_exporter_checksums:
  amd64: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
  arm64: ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7

# The firewall role decides who can reach this port.
node_exporter_listen: "0.0.0.0:9100"

node_exporter_textfile_dir: /var/lib/node_exporter/textfile

# Report the state of the services this baseline depends on (alerts fire if one stops).
node_exporter_systemd_units:
  - ssh.service
  - fail2ban.service
  - server-baseline-firewall.service
  - auditd.service
  - node_exporter.service
  - apt-daily-upgrade.timer
  - server-baseline-audit.timer

# Written to the textfile directory as server_baseline_info, so dashboards can show
# which baseline version each server runs.
node_exporter_baseline_version: "1.0.0"
# kind="container" or "machine": alerts use it to know where auditd can run.
node_exporter_in_container: >-
  {{ ansible_facts['virtualization_role'] == 'guest'
     and ansible_facts['virtualization_type'] in ['docker', 'podman', 'container', 'containerd', 'lxc'] }}

node_exporter_install_dir: /opt/node_exporter
