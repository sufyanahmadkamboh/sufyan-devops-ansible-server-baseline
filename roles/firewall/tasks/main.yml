---
- name: Refuse a rule set that would block SSH
  ansible.builtin.assert:
    that:
      - firewall_rules | selectattr('port', 'equalto', firewall_ssh_port) | list | length > 0
    fail_msg: "firewall_rules has no rule for SSH port {{ firewall_ssh_port }}; applying it would cut off this session."
    quiet: true

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Create the rules directory
  ansible.builtin.file:
    path: "{{ firewall_rules_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# `nft -c` parses and checks the file against the kernel without changing anything.
- name: Write the firewall rules
  ansible.builtin.template:
    src: server-baseline.nft.j2
    dest: "{{ firewall_rules_file }}"
    owner: root
    group: root
    mode: "0640"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload firewall

- name: Install the firewall service
  ansible.builtin.template:
    src: server-baseline-firewall.service.j2
    dest: /etc/systemd/system/server-baseline-firewall.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload firewall

- name: Start the firewall now and at every boot
  ansible.builtin.systemd_service:
    name: server-baseline-firewall.service
    state: started
    enabled: true
    daemon_reload: true

# The service stays "active" even if someone deletes the rules by hand, so look at the kernel.
- name: Check that the rules are really loaded
  ansible.builtin.command: nft list table inet {{ firewall_table }}
  register: firewall_loaded
  changed_when: firewall_loaded.rc != 0
  failed_when: false
  check_mode: false
  notify: Reload firewall
