[defaults]
roles_path = ./roles
inventory = ./inventories/lab/hosts.yml
interpreter_python = auto_silent
callback_result_format = yaml
forks = 10
retry_files_enabled = False
nocows = True

[ssh_connection]
pipelining = True
# Lab containers get fresh host keys on every `make lab-up`; lab-up clears this file.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/keys/known_hosts
